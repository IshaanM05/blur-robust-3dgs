name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch keeps the job small; the unit tests do not need a GPU or gsplat's CUDA build.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Installing the package checks that `pip install -e .` works in a clean environment.
      - run: pip install -e ".[dev]"
      - run: pytest -q tests
